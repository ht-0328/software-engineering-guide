# docs/ の Markdown からサイトを作り、GitHub Pages で公開する。
#
# 公開先: https://ht-0328.github.io/software-engineering-guide/
#
# 手順は README.md「サイトを作って見る」と同じものをそのままなぞる。
# 依存の版は tools/Dockerfile の一箇所だけに持たせたいため、
# CI でも Docker を使う。ここに pip install を並べると、同じ一覧が二箇所に分かれる。
#
# この workflow を動かす前に、リポジトリの Settings > Pages で
# Source を「GitHub Actions」にしておくこと。設定しないと最後の配信で失敗する。

name: サイトを公開する

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は一度に一つだけ動かす。走っているものは止めずに待つ。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: サイトを作る
    runs-on: ubuntu-latest
    steps:
      # 検査もサイト生成もサブモジュールの道具を使う。必ず一緒に取得する。
      - name: リポジトリを取得する
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # 検査・抽出・サイト生成をこの1つで動かす。中身は tools/Dockerfile にある。
      - name: 道具のイメージを作る
        run: docker build -t guide-tools -f tools/Dockerfile tools/

      # 図を描く Mermaid を先に取り込む。これを飛ばすと build_site.py は
      # 警告を出すだけで成功してしまい、図が記法のままのサイトが公開される。
      - name: 同梱するライブラリを取得する
        run: bash engineering-docs-standard/tools/fetch_vendor.sh

      # エラーが1件でもあれば、ここで止まる。警告では止まらない。
      - name: 文書を検査する
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/w" -w /w \
            guide-tools python tools/doc_lint.py

      # --user を付けないと site/ の所有者が root になり、次の収集で失敗する。
      # --strict を付けると、リンク切れなどの警告1件で止まる。
      - name: サイトを作る
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/w" -w /w \
            guide-tools python tools/build_site.py --strict

      - name: Pages の設定を読み込む
        uses: actions/configure-pages@v6

      - name: 成果物を渡す
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: サイトを配る
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 公開する
        id: deployment
        uses: actions/deploy-pages@v5
