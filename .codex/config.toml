# このリポジトリでの codex の設定
#
# codex はリポジトリの根の .codex/config.toml を読み、
# ~/.codex/config.toml へ重ねる。ここに書いた項目だけを上書きする。
# 未知のキーは `codex exec --strict-config` が名前を挙げて弾く。
#
# 禁止コマンドと発信元の許可は .codex/rules/repository.rules にある。

# 使うモデルと推論の強さ。
#
# gpt-5.6-sol は、このアカウントで使える唯一の会話モデルである。
# -mini や gpt-5.6 は「ChatGPT アカウントでは使えない」と拒否される。
# 明示するのは、既定が変わったときに黙って挙動が変わらないようにするためである。
#
# 強さは medium にする。既定の high は消費が激しく、章を1本調べる途中で
# 利用上限に達した。2026-09-07 の3章で3回とも同じ形で失敗している。
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

# 既定は読み取りのみとする。
# 調査を頼む用途しか無く、docs/ と research/ への書き込みは
# 依頼した側（Claude Code）が行うためである。
sandbox_mode = "read-only"

# 読み取りのみで動かすため、実行のたびに確認を求めない。
approval_policy = "never"

[sandbox_workspace_write]
# 書き込みを許す設定で動かす場合でも、シェルからの通信は閉じる。
# 外へ出る経路を、記録の残る組み込みのWeb検索1つに絞るためである。
network_access = false

[tools]
# 公開情報の調査に要る。規格の版数と発行年は書籍の外にある。
web_search = true
